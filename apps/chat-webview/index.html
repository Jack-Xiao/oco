<!doctype html>
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oco</title>
    <style>
      /* VS Code's default webview styles (@layer vscode-default, put first in <head>) outline every focused <a>, so a
         mouse click on a link-like row (the subagent card) boxes the whole row. Give anchors the browser's own focus
         ring back, as in the OpenCode web app: keyboard focus only. This layer sits between VS Code's and the app's
         (Vite appends the app stylesheet after it), so the app's own focus styles still win. */
      @layer oco-webview {
        a:focus {
          outline: revert;
          outline-offset: revert;
        }
      }
    </style>
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden bg-v2-background-bg-deep">
    <div id="root" class="flex flex-col h-dvh bg-v2-background-bg-deep"></div>
    <!-- Painted before the app bundle arrives and kept over the app until it shows text (src/main.tsx), on VS Code's
         editor background so opening a panel does not flash between colours and loading screens. -->
    <div id="oco-boot" aria-busy="true" aria-label="Loading">
      <style>
        #oco-boot { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 16px; pointer-events: none; background: var(--vscode-editor-background, transparent); }
        #oco-boot i { display: block; height: 10px; border-radius: 5px; background: rgba(127, 127, 127, 0.14); animation: oco-boot 1.2s ease-in-out infinite alternate; }
        #oco-boot .p { margin-top: auto; height: 88px; border-radius: 10px; background: none; border: 1px solid rgba(127, 127, 127, 0.22); animation: none; }
        @keyframes oco-boot { to { opacity: 0.45; } }
        @media (prefers-reduced-motion: reduce) { #oco-boot i { animation: none; } }
      </style>
      <i style="width: 38%"></i><i style="width: 72%"></i><i style="width: 64%"></i><i style="width: 46%"></i>
      <i class="p"></i>
    </div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
